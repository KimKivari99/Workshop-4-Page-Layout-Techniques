<!doctype html>
<html lang="eng">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Task 1: added semantic elements -->
    <header>
      <h1>My Website</h1>
      <nav>
        <ul>
          <li><a href="#about">About</a></li>
          <li><a href="#services">Services</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="about">
        <h2>Responsive elements</h2>
        <p>
          In this section, we will explore responsive design techniques using
          CSS Grid and Flexbox..
        </p>
        <!-- Task 2: added grid layout -->
        <div class="grid-container">
          <div class="grid-item">1</div>
          <div class="grid-item">2</div>
          <div class="grid-item">3</div>
          <div class="grid-item">4</div>
          <div class="grid-item">5</div>
          <div class="grid-item">6</div>
        </div>
        <!-- Task 3: added flexbox -->
        <div class="flex-container">
          <div class="box">Box 1</div>
          <div class="box">Box 2</div>
          <div class="box">Box 3</div>
        </div>
        <!-- Task 4: added responsive-box for media queries -->
        <div class="responsive-box">Resize the window to see the effect</div>
      </section>
    </main>
    <!-- Task 5: CSS and HTML validated succesfully -->
    <footer>
      <p>Copyright 2025</p>
    </footer>
  </body>
</html>
